input: .
output: .retype
url: https://nogringo.github.io/nostr-mail

exclude:
  - README.md
  - nostrhub/
  - node_modules/
  - .git/

branding:
  title: Nostr Mail
  label: Docs
  colors:
    label:
      text: "#ffffff"
      background: "#8b5cf6"

links:
  - text: Nmail
    link: https://app.nostrmail.org
    icon: mail
  - text: nostrmail.org
    link: https://nostrmail.org
    icon: globe
  - text: GitHub
    link: https://github.com/nogringo/nostr-mail
    icon: mark-github
  - text: Dart Package
    link: https://pub.dev/packages/nostr_mail
    icon: package
  - text: npm Package
    link: https://www.npmjs.com/package/nostr-mail
    icon: package

footer:
  copyright: "Made with [Retype](https://retype.com)"

poweredByRetype: true

editor:
  enabled: true

search:
  hotkeys:
    - "/"
    - "k"

meta:
  title: " | Nostr Mail Documentation"

templating:
  enabled: true
